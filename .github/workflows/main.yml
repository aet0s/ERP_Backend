name: ERP Backend Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout the exact commit that triggered this deployment
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Create deployment package
      #
      # .env is excluded because production .env lives on AWS.
      # node_modules is excluded because AWS will run npm ci.
      # ============================================================
      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf /tmp/backend-release.tar.gz .

          echo "Deployment package created:"
          ls -lh /tmp/backend-release.tar.gz

      # ============================================================
      # 3. Configure SSH
      # ============================================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/erp_deploy_key

          chmod 600 ~/.ssh/erp_deploy_key

          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      # ============================================================
      # 4. Upload deployment package to AWS
      # ============================================================
      - name: Upload release
        run: |
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/erp_deploy_key \
            /tmp/backend-release.tar.gz \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/tmp/backend-release.tar.gz"

          echo "Release uploaded successfully."

      # ============================================================
      # 5. Run deployment script on AWS
      #
      # The deployment script on AWS handles:
      #
      # - Backup current backend
      # - Extract new release
      # - Preserve production .env
      # - npm ci
      # - Node syntax check
      # - Switch application
      # - PM2 restart
      # - Health check
      # - Rollback if health check fails
      # ============================================================
      - name: Deploy on AWS
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/erp_deploy_key \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "sudo -n /usr/local/bin/deploy-erp-backend"
